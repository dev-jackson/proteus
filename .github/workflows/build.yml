# Builds Proteus on every push, so a break is found here rather than by the
# first person who downloads it.
#
# There is only one platform: the whole product is a macOS app that runs
# Windows programs. A Linux runner could not even compile it.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The release workflow only ever runs on a tag, so nothing checks it until
  # the moment it matters most. Thirty seconds here stops a release failing on
  # a typo in its own YAML.
  workflows:
    name: The workflows themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  # Every script here is run by hand at some point, several of them while
  # something is half-installed. A shell mistake in that position is expensive,
  # and shellcheck finds most of them for free.
  scripts:
    name: The shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh

  macos:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tests
        run: swift test

      # The real check: not that the code compiles, but that a bundle comes out
      # the other end with everything in it. A missing helper binary compiles
      # perfectly and fails on someone's Mac.
      - name: Assemble Proteus.app
        run: ./scripts/bundle.sh release

      - name: The bundle has all of its parts
        run: |
          set -euo pipefail
          for part in Contents/MacOS/Proteus \
                      Contents/Resources/proteus \
                      Contents/Resources/proteus-launcher \
                      Contents/Resources/Proteus.icns \
                      Contents/Info.plist; do
            if [ ! -e "build/Proteus.app/$part" ]; then
              echo "::error::missing from the bundle: $part"
              exit 1
            fi
            echo "  ✓ $part"
          done

      # The version in the bundle has to match the file that claims to be the
      # single source of it. They drift the moment someone edits one of them.
      - name: The bundle agrees with VERSION
        run: |
          set -euo pipefail
          FILE="$(tr -d '[:space:]' < VERSION)"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                   build/Proteus.app/Contents/Info.plist)"
          echo "VERSION: $FILE   bundle: $PLIST"
          [ "$FILE" = "$PLIST" ] || { echo "::error::they disagree"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: Proteus-app-unsigned
          path: build/Proteus.app
