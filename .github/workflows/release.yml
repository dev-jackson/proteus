# Builds a tagged version, and publishes it *if* this repository can sign.
#
# ## The normal path is not this file
#
#   ./scripts/release.sh
#
# That builds, signs, notarises, verifies, tags and publishes from a Mac that
# already holds the certificate and the notary profile. Signing in CI means
# exporting the certificate and its password into a shared runner's secrets to
# save four minutes on a laptop that already has both, which is a bad trade.
#
# So this workflow exists for two reasons and no others: to prove a tag still
# builds and passes its tests on a clean machine, and to take over the whole
# release if someone does set the signing secrets — a fork, a second
# maintainer, or a future where releases stop going through one laptop.
name: release

on:
  push:
    tags: ['v*']
  # Lets a release be rebuilt without moving the tag, which is what you want
  # when the build failed rather than the code.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    outputs:
      signed: ${{ steps.capability.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The tag says one version and the code says another often enough that it
      # is worth failing here rather than shipping the mismatch.
      - name: The tag and the code must agree
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CODE="v$(tr -d '[:space:]' < VERSION)"
          echo "tag: $TAG   code: $CODE"
          [ "$TAG" = "$CODE" ] || {
            echo "::error::Tag $TAG does not match VERSION ($CODE)"
            exit 1
          }

      - name: Tests
        run: swift test

      - name: Build the .dmg
        run: ./scripts/package.sh

      # Decided once, up front, so every later step agrees about it. Without a
      # certificate this run is a build check and says so — it is not a failure,
      # because a fork cannot have one and must not be blocked by that.
      - name: Can this runner sign?
        id: capability
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASS: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$CERT" ] && [ -n "$PASS" ] && [ -n "$APPLE_ID" ] && [ -n "$NOTARY_PASS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are present: this run will publish."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets. This run checks the build only."
            echo "::notice::Publish from a Mac with the certificate: ./scripts/release.sh"
          fi

      - name: Sign and notarise
        if: steps.capability.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASS: ${{ secrets.MACOS_CERTIFICATE_PASS }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: ./scripts/sign-macos.sh

      # The certificate must not outlive the job on a shared machine. The
      # script wipes its own keychain; this wipes it again in case the script
      # died before it could.
      - name: Leave no certificate behind
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/proteus-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

      # The guard that matters. Signing can succeed and still leave a .dmg that
      # does nothing when a stranger double clicks it — the exact failure this
      # project exists to eliminate, so publishing one would be worse than
      # publishing nothing.
      - name: It has to open on someone else's Mac
        if: steps.capability.outputs.signed == 'true'
        run: |
          set -euo pipefail
          if ./scripts/verify-macos-download.sh; then
            exit 0
          fi
          echo "::error::This .dmg would not open for anyone who downloaded it."
          exit 1

      - name: Checksum
        if: steps.capability.outputs.signed == 'true'
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  publish:
    needs: macos
    # Only when the artefact is one a stranger could actually open. Otherwise
    # the release was cut from a Mac by ./scripts/release.sh and there is
    # nothing here to add.
    if: needs.macos.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Write the release notes
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "## Install"
            echo
            echo "Download the \`.dmg\`, open it, drag **Proteus** to Applications."
            echo
            echo "Requires macOS 14 or later, on Apple silicon or Intel."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Free software under the GPL v3. Built from the \`$TAG\` tag."
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Proteus ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
